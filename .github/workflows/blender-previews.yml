name: Blender previews (max quality)

on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/blender/**'
      - '.github/workflows/blender-previews.yml'
      - 'tools/render_max.py'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        group: [overview, pv, storage, classroom, charge, dist]
    steps:
      - uses: actions/checkout@v4

      - name: Cache Blender 4.2.0
        uses: actions/cache@v4
        with:
          path: /tmp/blender-4.2.0-linux-x64
          key: blender-4.2.0

      - name: Install Blender 4.2.0
        run: |
          if [ ! -x /tmp/blender-4.2.0-linux-x64/blender ]; then
            cd /tmp && curl -sL -o blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz
            tar -xf blender.tar.xz
          fi
          # EEVEE_NEXT needs EGL/OpenGL + Mesa software GL on headless runners
          # (xvfb alone is not enough: Blender core-dumps on missing libEGL.so.1).
          sudo apt-get update -qq && sudo apt-get install -y -qq \
            xvfb libegl1 libgl1 libgl1-mesa-dri libglx-mesa0 libglvnd0 \
            libglib2.0-0 libsm6 libice6 libx11-6 libxext6 libxi6 libxrender1 \
            libxkbcommon0 libfontconfig1 libxcb1 > /dev/null
          /tmp/blender-4.2.0-linux-x64/blender --version

      - name: Render group (max quality)
        run: |
          set -euo pipefail
          mkdir -p screenshots/blender /tmp/render
          shopt -s nullglob
          files=(assets/blender/${{ matrix.group }}/*.blend)
          if [ ${#files[@]} -eq 0 ]; then
            echo "ERROR: no .blend files in group ${{ matrix.group }}"
            exit 1
          fi
          failed=0
          for f in "${files[@]}"; do
            name=$(basename "$f" .blend)
            echo "=== $name ==="
            rm -f "/tmp/render/${name}_0001.png" /tmp/render/${name}-*.png
            rc=0
            xvfb-run -a /tmp/blender-4.2.0-linux-x64/blender -b "$f" -E BLENDER_EEVEE_NEXT -o "/tmp/render/${name}_" --python tools/render_max.py -f 1 || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "FAILED: $name (blender exit $rc)"
              failed=1
              continue
            fi
            if [ ! -s "/tmp/render/${name}_0001.png" ]; then
              echo "NO OUTPUT: $name"
              failed=1
              continue
            fi
            mv "/tmp/render/${name}_0001.png" "screenshots/blender/${name}.png"
            # Sparse pieces (render_max.py cluster framing) also emit
            # <name>-<cluster>.png stills; collect them as well.
            for extra in /tmp/render/${name}-*.png; do
              [ -e "$extra" ] && mv "$extra" screenshots/blender/
            done
          done
          echo "--- rendered files ---"
          ls -la screenshots/blender/
          if [ "$failed" -ne 0 ]; then
            echo "ERROR: one or more renders failed in group ${{ matrix.group }}"
            exit 1
          fi

      - name: Check outputs before upload
        run: |
          count=$(ls screenshots/blender/*.png 2>/dev/null | wc -l)
          echo "PNG count: $count"
          if [ "$count" -eq 0 ]; then
            echo "ERROR: screenshots/blender/ is empty, nothing to upload"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: blender-previews-${{ matrix.group }}
          path: screenshots/blender/*.png
          if-no-files-found: error
          retention-days: 30

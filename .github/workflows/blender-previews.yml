name: Blender previews (max quality)

on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/blender/**'
      - '.github/workflows/blender-previews.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        group: [overview, pv, storage, classroom, charge, dist]
    steps:
      - uses: actions/checkout@v4

      - name: Cache Blender 4.2.0
        uses: actions/cache@v4
        with:
          path: /tmp/blender-4.2.0-linux-x64
          key: blender-4.2.0

      - name: Install Blender 4.2.0
        run: |
          if [ ! -x /tmp/blender-4.2.0-linux-x64/blender ]; then
            cd /tmp && curl -sL -o blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz
            tar -xf blender.tar.xz
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
          /tmp/blender-4.2.0-linux-x64/blender --version

      - name: Render group (max quality)
        run: |
          mkdir -p screenshots/blender /tmp/render
          for f in assets/blender/${{ matrix.group }}/*.blend; do
            name=$(basename "$f" .blend)
            echo "=== $name ==="
            xvfb-run -a /tmp/blender-4.2.0-linux-x64/blender -b "$f" -E BLENDER_EEVEE_NEXT --python tools/render_max.py -o /tmp/render/${name}_ -f 1 || echo "FAILED: $name"
            mv /tmp/render/${name}_0001.png "screenshots/blender/${name}.png" 2>/dev/null || echo "NO OUTPUT: $name"
          done
          ls -la screenshots/blender/

      - uses: actions/upload-artifact@v4
        with:
          name: blender-previews-${{ matrix.group }}
          path: screenshots/blender/*.png
          retention-days: 30
